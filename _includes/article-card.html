<div class="card">
  <a href="{{ post.url | relative_url }}">
    {% if post.image and post.image != "" %}
      <img src="{{ post.image | relative_url }}" alt="" loading="lazy">
    {% endif %}
    <div class="card-content">
      <h2>{{ post.title }}</h2>
      {% if post.excerpt %}
        <p>{{ post.excerpt }}</p>
      {% endif %}
      <div class="card-meta">
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
      </div>
    </div>
  </a>
</div>
