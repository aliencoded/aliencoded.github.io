# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Meta Currents
tagline: "Independent news from multiple perspectives"
# email: redacted
author: Ali Abid
logo: /assets/images/meta-currents-icon-medium.jpeg  # used by jekyll-seo-tag for publisher.logo in JSON-LD
description: >- # this means to ignore newlines until "baseurl:"
  Meta Currents is an independent news site presenting global stories from multiple political perspectives. We cover geopolitics, business, technology, US politics, and more — giving readers context from across the political spectrum so they can form their own views.

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://metacurrents.com" # the base hostname & protocol for your site
twitter_username: alisotropy
github_username:  aliencoded

# Build settings
markdown: kramdown

# theme: minima

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# plugins:
#  - jekyll-feed

# Exclude from processing — kept out of the built site at _site/
exclude:
  - CLAUDE.md
  - AUTHORING.md
  - README.md
  - LICENSE
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - vendor
  - _scripts
  - _posts            # legacy unused collection — files in here aren't part of the site
  - _drafts

collections:
  pages:
    output: true
    permalink: /pages/:title/
  articles:
    output: true
    permalink: /articles/:title/   # clean URL without .html extension
  people:
    output: true
  videos:
    output: true

# jekyll-feed: source the main /feed.xml from the `articles` collection
# (the site does not use `_posts`). The empty `posts` feed is parked at
# /feed/posts.xml so it does not collide with the articles feed at /feed.xml.
# The Atom discovery <link> in <head> is hand-rolled to point at /feed.xml
# (see _includes/head.html) because feed_meta would otherwise emit the
# /feed/posts.xml URL from `feed.path`.
feed:
  path: /feed/posts.xml
  posts_limit: 200
  collections:
    articles:
      path: /feed.xml
   


# jekyll-seo-tag emits BlogPosting JSON-LD by default. For articles, override
# to NewsArticle (more accurate, eligible for Google News rich-results when
# the publication itself is approved by Publisher Center).
defaults:
  - scope:
      type: articles
    values:
      seo:
        type: NewsArticle

# quiet warnings during builds
sass:
  quiet_deps: true
  
# stop 404ing future posts

future: true

verbose: true