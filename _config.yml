# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Meta Currents
# email: redacted
author: Ali Abid
description: >- # this means to ignore newlines until "baseurl:"
  Meta Currents is an independent news site presenting global stories from multiple political perspectives. We cover geopolitics, business, technology, US politics, and more — giving readers context from across the political spectrum so they can form their own views.

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://metacurrents.com" # the base hostname & protocol for your site
twitter_username: alisotropy
github_username:  aliencoded

# Build settings
markdown: kramdown

# theme: minima

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# plugins:
#  - jekyll-feed

# Exclude from processing — kept out of the built site at _site/
exclude:
  - CLAUDE.md
  - AUTHORING.md
  - README.md
  - LICENSE
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - vendor
  - _scripts

collections:
  pages:
    output: true        # this is REQUIRED to generate HTML pages
    permalink: /pages/:title/   # optional: makes URLs clean 
  articles:
    output: true      # ensures each article generates a page
  people:
    output: true        # this is REQUIRED to generate HTML pages
  videos:
    output: true        # this is REQUIRED to generate HTML pages
   #  permalink: /people/:title/   # optional: makes URLs clean
   


# quiet warnings during builds
sass:
  quiet_deps: true
  
# stop 404ing future posts

future: true

verbose: true