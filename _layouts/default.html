<!DOCTYPE html>


<!--base html scaffold for all other pages on the site-->
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  <!--meta header info-->
  {%- include head.html -%}

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <!-- combined site header: logo (top-left) + nav -->
    {%- include header.html -%}
    <!-- unique content -->
    <main id="main-content" class="page-content" aria-label="Content" tabindex="-1">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <!--common site  bottom -->
    {%- include footer.html -%}

    {%- include search-modal.html -%}

    <script src="{{ '/assets/js/clock.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/load-more.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/utility-nav.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/reading-progress.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/share-copy.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}" defer></script>

  </body>

</html>
