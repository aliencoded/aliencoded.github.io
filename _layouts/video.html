---
layout: default
---

<div class="wrapper video-detail">
  <h1>{{ page.title }}</h1>

  <div class="video-player">
    {% include youtube.html id=page.video_id title=page.title %}
  </div>

  <div class="video-description">
    {{ page.content }}
  </div>

  {% if page.tags %}
  <div class="video-tags">
    <strong>Tags:</strong>
    {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
    {% endfor %}
  </div>
  {% endif %}

  <a href="/pages/youtube" class="back-link">← Back to all videos</a>
</div>

<style>
.video-player iframe {
  width: 100%;
  height: 480px; /* standard YouTube embed size */
}

.video-description {
  margin: 1rem 0;
  line-height: 1.6;
}
.video-tags {
  margin: 0.5rem 0;
}
.tag {
  display: inline-block;
  background: #eee;
  color: #333;
  padding: 0.2rem 0.5rem;
  margin-right: 0.3rem;
  border-radius: 4px;
  font-size: 0.85rem;
}
.back-link {
  display: inline-block;
  margin-top: 1rem;
  color: #0066cc;
}
</style>
